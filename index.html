.tt button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .12s ease, box-shadow .12s ease, background .15s ease}
.tt button:active:not(:disabled){transform:scale(.97)}
.tt button:focus-visible{outline:3px solid #F2C94C;outline-offset:3px}
.tt button:disabled{cursor:not-allowed}
@media (hover:hover){.tt .lift:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 20px rgba(22,50,79,.16)}}
@keyframes ttpop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes ttshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes ttfall{0%{transform:translateY(-12vh) rotate(0deg);opacity:1}100%{transform:translateY(112vh) rotate(540deg);opacity:.85}}
@keyframes ttfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ttpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ttfill{from{width:0}to{width:100%}}
@keyframes tthp{from{width:var(--from)}to{width:var(--to)}}
.tt .pop{animation:ttpop .5s ease-out both}
.tt .shake{animation:ttshake .45s ease-in-out}
.tt .fade{animation:ttfade .3s ease-out both}
.tt .pulse{animation:ttpulse 1.2s ease-in-out infinite}
.tt .card3d{perspective:800px}
.tt .card3d .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s ease}
.tt .card3d .inner.up{transform:rotateY(180deg)}
.tt .card3d .face,.tt .card3d .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tt .card3d .face{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.tt *{animation:none!important;transition:none!important}.tt .card3d .inner{transition:none!important}}
